services:
  gateway:
    build:
      context: /home/batt/hermes/Hermes-Workspace
      dockerfile: /opt/hermes/compose/gateway/Dockerfile
    container_name: hermes-workspace-gateway
    restart: unless-stopped
    init: true

    env_file:
      - /opt/hermes/vault/gateway/gateway.env

    environment:
      DATABASE_ENABLED: "true"

    networks:
      - hermes-private

    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  hermes-private:
    external: true
